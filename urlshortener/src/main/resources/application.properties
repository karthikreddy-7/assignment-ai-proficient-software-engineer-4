spring.application.name=urlshortener

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:urlshortener}
spring.datasource.password=${DB_PASSWORD:urlshortener}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-none}] [%thread] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

springdoc.swagger-ui.path=/swagger-ui.html

app.api-key=${API_KEY:testing}
app.cache.max-size=10000
app.cache.ttl-minutes=10
app.async.core-pool-size=4
app.async.max-pool-size=8
app.async.queue-capacity=500

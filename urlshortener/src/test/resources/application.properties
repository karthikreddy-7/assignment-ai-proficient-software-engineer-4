spring.application.name=urlshortener

spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-none}] [%thread] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

springdoc.swagger-ui.path=/swagger-ui.html

app.api-key=testing
app.cache.max-size=10000
app.cache.ttl-minutes=10
app.async.core-pool-size=4
app.async.max-pool-size=8
app.async.queue-capacity=500
